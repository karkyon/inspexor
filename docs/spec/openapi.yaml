openapi: 3.1.0
info: {title: INSPEXOR API, version: 3.1.0-CHG-004}
servers: [{url: /api/v1}]
security: [{cookieAuth: []}]
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Session'}, '401': {$ref: '#/components/responses/Error'}}
  /auth/logout:
    post: {operationId: logout, responses: {'204': {description: Logged out}, '401': {$ref: '#/components/responses/Error'}}}
  /me:
    get: {operationId: getMe, responses: {'200': {$ref: '#/components/responses/Session'}, '401': {$ref: '#/components/responses/Error'}}}
  /work-reports:
    post:
      operationId: createWorkReport
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkDraft'}}}}
      responses: {'201': {$ref: '#/components/responses/Record'}, '422': {$ref: '#/components/responses/Error'}}
  /work-reports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getWorkReport, responses: {'200': {$ref: '#/components/responses/WorkReportDetail'}, '404': {$ref: '#/components/responses/Error'}}}
    patch:
      operationId: updateWorkReport
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /work-reports/{id}/confirm:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {operationId: confirmWorkReport, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports:
    post: {operationId: createDeliveryReport, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryDraft'}}}}, responses: {'201': {$ref: '#/components/responses/Record'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getDeliveryReport, responses: {'200': {$ref: '#/components/responses/DeliveryReportDetail'}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {operationId: updateDeliveryReport, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryUpdate'}}}}, responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports/{id}/confirm:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {operationId: confirmDeliveryReport, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}}}
  /records:
    get: {operationId: listRecords, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {in: query, name: status, schema: {$ref: '#/components/schemas/RecordStatus'}}, {in: query, name: dateFrom, schema: {type: string, format: date}}, {in: query, name: dateTo, schema: {type: string, format: date}}, {in: query, name: type, description: 'CHG-004 D6', schema: {enum: [WORK, DELIVERY]}}, {in: query, name: customerId, description: 'CHG-004 D6', schema: {type: string, format: uuid}}, {in: query, name: productId, description: 'CHG-004 D6（運搬は明細のいずれか）', schema: {type: string, format: uuid}}], responses: {'200': {description: Paged records, content: {application/json: {schema: {$ref: '#/components/schemas/RecordPage'}}}}}}
  /delivery-reports/{id}/fee:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {operationId: setDeliveryFee, description: 'CHG-004 D2: 運搬費（運搬報告1件に1金額）の後入力・修正。版は作らず監査。DRAFT は PATCH、BILLING_LOCKED は 409', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryFee'}}}}, responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /reports/monthly:
    get: {operationId: getMonthlySummary, description: 'CHG-004 D4: 月次集計（暦月の確定済み報告の現在の確定版）。運搬費は手入力分の合計のみ', parameters: [{in: query, name: month, required: true, schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}}, {in: query, name: type, schema: {enum: [WORK, DELIVERY]}}, {in: query, name: customerId, schema: {type: string, format: uuid}}, {in: query, name: productId, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Monthly summary（totals / daily / byProduct / byWorkType / rows / names）'}, '400': {$ref: '#/components/responses/Error'}}}
  /reports/monthly/export:
    get: {operationId: exportMonthlySummary, description: 'CHG-004 D4: Excel（集計・日別・品番別・作業内容別・明細）または CSV（sheet 単位、UTF-8 BOM）', parameters: [{in: query, name: month, required: true, schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}}, {in: query, name: type, schema: {enum: [WORK, DELIVERY]}}, {in: query, name: customerId, schema: {type: string, format: uuid}}, {in: query, name: productId, schema: {type: string, format: uuid}}, {in: query, name: format, schema: {enum: [xlsx, csv], default: xlsx}}, {in: query, name: sheet, schema: {enum: [summary, daily, product, worktype, detail], default: detail}}], responses: {'200': {description: File, content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}, text/csv: {schema: {type: string}}}}, '400': {$ref: '#/components/responses/Error'}}}
  /records/{type}/{id}/{action}:
    parameters: [{in: path, name: type, required: true, schema: {enum: [WORK, DELIVERY]}}, {$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [approve,reject,revoke,revise]}}]
    post: {operationId: transitionRecord, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /masters/{type}:
    get: {operationId: listMasters, parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {description: Masters, content: {application/json: {schema: {type: object, required: [data,meta], properties: {data: {type: array, items: {$ref: '#/components/schemas/MasterRecord'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}}}}}}
    post: {operationId: createMaster, parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MasterWrite'}}}}, responses: {'201': {$ref: '#/components/responses/Master'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /masters/{type}/{id}:
    parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}, {$ref: '#/components/parameters/Id'}]
    get: {operationId: getMaster, responses: {'200': {$ref: '#/components/responses/Master'}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {operationId: updateMaster, parameters: [{$ref: '#/components/parameters/Preview'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MasterUpdate'}}}}, responses: {'200': {$ref: '#/components/responses/MasterOrImpact'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deactivateMaster, parameters: [{$ref: '#/components/parameters/Preview'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'200': {$ref: '#/components/responses/MasterImpact'}, '204': {description: Deactivated}, '409': {$ref: '#/components/responses/Error'}}}
  /billing-runs:
    post: {operationId: createBillingRun, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BillingRunRequest'}}}}, responses: {'201': {description: Billing run}}}
  /billing-runs/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [calculate,review,finalize,void]}}]
    post: {operationId: transitionBillingRun, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {description: Accepted}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /billing-runs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getBillingRun, responses: {'200': {description: Run with lines and warnings}, '404': {$ref: '#/components/responses/Error'}}}
  /invoices/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getInvoice, responses: {'200': {description: Invoice snapshot, documents, recipients and mail history}, '404': {$ref: '#/components/responses/Error'}}}
  /invoices/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [issue,send,resend,void]}}]
    post: {operationId: transitionInvoice, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {description: Accepted}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /documents/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getDocument, responses: {'200': {description: Metadata and 10-minute signed URL}, '404': {$ref: '#/components/responses/Error'}}}
  /documents/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [regenerate,send,retry]}}]
    post: {operationId: documentAction, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {description: Queued}, '409': {$ref: '#/components/responses/Error'}}}
components:
  securitySchemes: {cookieAuth: {type: apiKey, in: cookie, name: __Secure-inspexor.session}}
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 100}}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Preview: {in: query, name: preview, description: 'CHG-001: true の場合は更新/無効化せず遡及影響（MasterImpact）を返す（REQ-MST-001 遡及影響preview）', schema: {type: boolean, default: false}}
  schemas:
    LoginRequest: {type: object, required: [loginId,password], properties: {loginId: {type: string, minLength: 1, maxLength: 100}, password: {type: string, minLength: 8, maxLength: 128}}, additionalProperties: false}
    Command: {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}, reason: {type: string, maxLength: 1000}}, additionalProperties: false}
    WorkDraft: {type: object, required: [workDate,reporterId,customerId,productId,workTypeId,workerIds,startAt,endAt,quantity,defects], properties: {workDate: {type: string, format: date}, reporterId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, productId: {type: string, format: uuid}, workTypeId: {type: string, format: uuid}, lotNo: {type: [string,'null'], maxLength: 100}, workerIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}, startAt: {type: string, format: date-time}, endAt: {type: string, format: date-time}, quantity: {type: integer, minimum: 0}, defects: {type: array, items: {$ref: '#/components/schemas/Defect'}}, workLocationId: {type: [string,'null'], format: uuid}, vehicleId: {type: [string,'null'], format: uuid}, remarks: {type: [string,'null'], maxLength: 500}}, additionalProperties: false}
    WorkUpdate: {type: object, required: [workDate,reporterId,customerId,productId,workTypeId,workerIds,startAt,endAt,quantity,defects,expectedVersion], properties: {workDate: {type: string, format: date}, reporterId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, productId: {type: string, format: uuid}, workTypeId: {type: string, format: uuid}, lotNo: {type: [string,'null'], maxLength: 100}, workerIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}, startAt: {type: string, format: date-time}, endAt: {type: string, format: date-time}, quantity: {type: integer, minimum: 0}, defects: {type: array, items: {$ref: '#/components/schemas/Defect'}}, workLocationId: {type: [string,'null'], format: uuid}, vehicleId: {type: [string,'null'], format: uuid}, remarks: {type: [string,'null'], maxLength: 500}, expectedVersion: {type: integer, minimum: 1}}, additionalProperties: false}
    Defect: {type: object, required: [defectTypeId,quantity], properties: {defectTypeId: {type: string, format: uuid}, quantity: {type: integer, minimum: 0}}, additionalProperties: false}
    DeliveryDraft: {type: object, required: [deliveryDate,driverId,customerId,items], properties: {deliveryDate: {type: string, format: date}, driverId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DeliveryItem'}}, vehicleId: {type: [string,'null'], format: uuid}, tripCount: {type: integer, minimum: 1, maximum: 99, default: 1}, deliveryFeeYen: {type: [integer,'null'], minimum: 0, maximum: 9999999}}, additionalProperties: false}
    DeliveryUpdate: {type: object, required: [deliveryDate,driverId,customerId,items,expectedVersion], properties: {deliveryDate: {type: string, format: date}, driverId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DeliveryItem'}}, vehicleId: {type: [string,'null'], format: uuid}, tripCount: {type: integer, minimum: 1, maximum: 99, default: 1}, deliveryFeeYen: {type: [integer,'null'], minimum: 0, maximum: 9999999}, expectedVersion: {type: integer, minimum: 1}}, additionalProperties: false}
    DeliveryFee: {type: object, required: [expectedVersion,deliveryFeeYen], properties: {expectedVersion: {type: integer, minimum: 1}, deliveryFeeYen: {type: [integer,'null'], minimum: 0, maximum: 9999999}, reason: {type: string, maxLength: 1000}}, additionalProperties: false}
    DeliveryItem: {type: object, required: [productId,quantity], properties: {productId: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}, additionalProperties: false}
    RecordStatus: {enum: [DRAFT,CONFIRMED,SUBMITTED,APPROVED,REJECTED,REVOKED,BILLING_LOCKED]}
    Record: {type: object, required: [id,status,version], properties: {id: {type: string, format: uuid}, reportNo: {type: string}, status: {$ref: '#/components/schemas/RecordStatus'}, version: {type: integer}, documentStatus: {type: [string,'null']}, type: {enum: [WORK, DELIVERY]}, businessDate: {type: string, format: date}, revisionNo: {type: integer, minimum: 1}, customerId: {type: string, format: uuid, description: 'CHG-004 D6（一覧のみ）'}, productIds: {type: array, items: {type: string, format: uuid}}, quantity: {type: integer, minimum: 0}, tripCount: {type: [integer,'null'], minimum: 1}, deliveryFeeYen: {type: [integer,'null'], minimum: 0}}}
    WorkReportDetail: {type: object, required: [id,reportNo,status,version,documentStatus,documentId,ownerId,revisionId,revisionNo,parentRevisionId,confirmedAt,workDate,reporterId,customerId,productId,workTypeId,lotNo,workerIds,startAt,endAt,quantity,defects,breakMinutes,regularMinutes,overtimeMinutes,regularPersonMinutes,overtimePersonMinutes,workLocationId,vehicleId,remarks], properties: {id: {type: string, format: uuid}, reportNo: {type: string}, status: {$ref: '#/components/schemas/RecordStatus'}, version: {type: integer, minimum: 1}, documentStatus: {type: [string,'null']}, documentId: {type: [string,'null'], format: uuid}, ownerId: {type: string, format: uuid}, revisionId: {type: string, format: uuid}, revisionNo: {type: integer, minimum: 1}, parentRevisionId: {type: [string,'null'], format: uuid}, confirmedAt: {type: [string,'null'], format: date-time}, workDate: {type: string, format: date}, reporterId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, productId: {type: string, format: uuid}, workTypeId: {type: string, format: uuid}, lotNo: {type: [string,'null'], maxLength: 100}, workerIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}, startAt: {type: string, format: date-time}, endAt: {type: string, format: date-time}, quantity: {type: integer, minimum: 0}, defects: {type: array, items: {$ref: '#/components/schemas/Defect'}}, breakMinutes: {type: integer, minimum: 0}, regularMinutes: {type: integer, minimum: 0}, overtimeMinutes: {type: integer, minimum: 0}, regularPersonMinutes: {type: integer, minimum: 0}, overtimePersonMinutes: {type: integer, minimum: 0}, workLocationId: {type: [string,'null'], format: uuid}, vehicleId: {type: [string,'null'], format: uuid}, remarks: {type: [string,'null'], maxLength: 500}}, additionalProperties: false}
    DeliveryReportDetail: {type: object, required: [id,reportNo,status,version,documentStatus,documentId,ownerId,revisionId,revisionNo,parentRevisionId,confirmedAt,deliveryDate,driverId,customerId,items,vehicleId,tripCount,deliveryFeeYen], properties: {id: {type: string, format: uuid}, reportNo: {type: string}, status: {$ref: '#/components/schemas/RecordStatus'}, version: {type: integer, minimum: 1}, documentStatus: {type: [string,'null']}, documentId: {type: [string,'null'], format: uuid}, ownerId: {type: string, format: uuid}, revisionId: {type: string, format: uuid}, revisionNo: {type: integer, minimum: 1}, parentRevisionId: {type: [string,'null'], format: uuid}, confirmedAt: {type: [string,'null'], format: date-time}, deliveryDate: {type: string, format: date}, driverId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, items: {type: array, minItems: 1, items: {type: object, required: [productId,quantity,allocationEligible], properties: {productId: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}, allocationEligible: {type: boolean}}, additionalProperties: false}}, vehicleId: {type: [string,'null'], format: uuid}, tripCount: {type: integer, minimum: 1, maximum: 99}, deliveryFeeYen: {type: [integer,'null'], minimum: 0, maximum: 9999999}}, additionalProperties: false}
    RecordPage: {type: object, required: [data,meta], properties: {data: {type: array, items: {$ref: '#/components/schemas/Record'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
    PageMeta: {type: object, required: [page,pageSize,total], properties: {page: {type: integer}, pageSize: {type: integer}, total: {type: integer}}}
    MasterType: {enum: [customers,contacts,workers,products,work-types,defects,holidays,rates,transport-rules,fixed-charges,vehicles,work-locations]}
    CustomerWrite: {"type": "object", "required": ["code", "name", "closingDay"], "properties": {"code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 200}, "closingDay": {"type": "integer", "minimum": 1, "maximum": 31}, "active": {"type": "boolean", "default": true}}, "additionalProperties": false}
    CustomerUpdate: {"type": "object", "required": ["code", "name", "closingDay", "expectedVersion", "reason"], "properties": {"code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 200}, "closingDay": {"type": "integer", "minimum": 1, "maximum": 31}, "active": {"type": "boolean", "default": true}, "expectedVersion": {"type": "integer", "minimum": 1}, "reason": {"type": "string", "minLength": 1, "maxLength": 1000}}, "additionalProperties": false}
    ContactWrite: {"type": "object", "required": ["customerId", "code", "name", "email"], "properties": {"customerId": {"type": "string", "format": "uuid"}, "code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 100}, "email": {"type": "string", "format": "email", "maxLength": 320}, "sendDaily": {"type": "boolean", "default": false}, "sendInvoice": {"type": "boolean", "default": false}, "dailyProductIds": {"type": "array", "uniqueItems": true, "items": {"type": "string", "format": "uuid"}}, "invoiceProductIds": {"type": "array", "uniqueItems": true, "items": {"type": "string", "format": "uuid"}}, "active": {"type": "boolean", "default": true}}, "additionalProperties": false}
    ContactUpdate: {"type": "object", "required": ["customerId", "code", "name", "email", "expectedVersion", "reason"], "properties": {"customerId": {"type": "string", "format": "uuid"}, "code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 100}, "email": {"type": "string", "format": "email", "maxLength": 320}, "sendDaily": {"type": "boolean", "default": false}, "sendInvoice": {"type": "boolean", "default": false}, "dailyProductIds": {"type": "array", "uniqueItems": true, "items": {"type": "string", "format": "uuid"}}, "invoiceProductIds": {"type": "array", "uniqueItems": true, "items": {"type": "string", "format": "uuid"}}, "active": {"type": "boolean", "default": true}, "expectedVersion": {"type": "integer", "minimum": 1}, "reason": {"type": "string", "minLength": 1, "maxLength": 1000}}, "additionalProperties": false}
    WorkerWrite: {"type": "object", "required": ["code", "name"], "properties": {"code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 100}, "active": {"type": "boolean", "default": true}}, "additionalProperties": false}
    WorkerUpdate: {"type": "object", "required": ["code", "name", "expectedVersion", "reason"], "properties": {"code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 100}, "active": {"type": "boolean", "default": true}, "expectedVersion": {"type": "integer", "minimum": 1}, "reason": {"type": "string", "minLength": 1, "maxLength": 1000}}, "additionalProperties": false}
    VehicleWrite: {"type": "object", "required": ["code", "name"], "properties": {"code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 100}, "active": {"type": "boolean", "default": true}}, "additionalProperties": false}
    VehicleUpdate: {"type": "object", "required": ["code", "name", "expectedVersion", "reason"], "properties": {"code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 100}, "active": {"type": "boolean", "default": true}, "expectedVersion": {"type": "integer", "minimum": 1}, "reason": {"type": "string", "minLength": 1, "maxLength": 1000}}, "additionalProperties": false}
    WorkLocationWrite: {"type": "object", "required": ["code", "name"], "properties": {"code": {"type": "string", "minLength": 1, "maxLength": 30}, "name": {"type": "string", "minLength": 1, "maxLength": 100}, "active": {"type": "boolean", "default": true}}, "additionalProperties": false}
