openapi: 3.1.0
info: {title: INSPEXOR API, version: 3.1.0-CHG-012}
servers: [{url: /api/v1}]
security: [{cookieAuth: []}]
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      description: 'CHG-012: ADMIN_MFA_ENABLED のとき管理者は session を出さず確認待ち（MfaChallenge）を返す。回数制限（接続元・ログインID）を超えたら 429'
      responses: {'200': {description: 'Session、または多要素認証の確認待ち', content: {application/json: {schema: {type: object, properties: {data: {oneOf: [{$ref: '#/components/schemas/Session'}, {$ref: '#/components/schemas/MfaChallenge'}]}}}}}}, '401': {$ref: '#/components/responses/Error'}, '423': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /auth/mfa/setup:
    post:
      operationId: setupMfa
      security: []
      description: 'CHG-012 API-038: 未登録の管理者。秘密鍵（QR コード）と、秘密鍵を含む新しい確認待ちを返す（まだ保存しない）'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaSetupRequest'}}}}
      responses: {'200': {description: Setup, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/MfaSetup'}}}}}}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '423': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      security: []
      description: 'CHG-012 API-039: 確認コード（登録済みなら回復コードも可）→ session。登録時だけ recoveryCodes を一度返す。誤りは失敗回数に数え5回で423'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaVerifyRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Session'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}, '423': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /auth/reauth:
    post:
      operationId: reauthenticate
      description: 'CHG-012 API-040（SEC-026）: パスワード＋（多要素認証の登録者は）確認コード。session の認証時刻を更新し、10分間は代理入力・パスワード再設定・多要素認証の解除などができる'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReauthRequest'}}}}
      responses: {'200': {description: Reauthenticated, content: {application/json: {schema: {type: object, properties: {data: {type: object, required: [authAt, reauthExpiresAt], properties: {authAt: {type: string, format: date-time}, reauthExpiresAt: {type: string, format: date-time}}, additionalProperties: false}}}}}}, '401': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}, '423': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /auth/mfa:
    get:
      operationId: getMfaStatus
      description: 'CHG-012 API-041: 本人の多要素認証の状態'
      responses: {'200': {description: Status, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/MfaStatus'}}}}}}, '401': {$ref: '#/components/responses/Error'}}
  /auth/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      description: 'CHG-012 API-042: 回復コードの再発行（管理者・再認証から10分以内。過ぎていれば 403 reauthRequired）'
      responses: {'200': {description: Recovery codes, content: {application/json: {schema: {type: object, properties: {data: {type: object, required: [recoveryCodes], properties: {recoveryCodes: {type: array, items: {type: string, pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$'}}}, additionalProperties: false}}}}}}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /auth/logout:
    post: {operationId: logout, responses: {'204': {description: Logged out}, '401': {$ref: '#/components/responses/Error'}}}
  /me:
    get: {operationId: getMe, responses: {'200': {$ref: '#/components/responses/Session'}, '401': {$ref: '#/components/responses/Error'}}}
  /work-reports:
    post:
      operationId: createWorkReport
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkDraft'}}}}
      responses: {'201': {$ref: '#/components/responses/Record'}, '422': {$ref: '#/components/responses/Error'}}
  /work-reports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getWorkReport, responses: {'200': {$ref: '#/components/responses/WorkReportDetail'}, '404': {$ref: '#/components/responses/Error'}}}
    patch:
      operationId: updateWorkReport
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /work-reports/{id}/confirm:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {operationId: confirmWorkReport, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports:
    post: {operationId: createDeliveryReport, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryDraft'}}}}, responses: {'201': {$ref: '#/components/responses/Record'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getDeliveryReport, responses: {'200': {$ref: '#/components/responses/DeliveryReportDetail'}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {operationId: updateDeliveryReport, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryUpdate'}}}}, responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports/{id}/confirm:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {operationId: confirmDeliveryReport, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}}}
  /records:
    get: {operationId: listRecords, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {in: query, name: status, schema: {$ref: '#/components/schemas/RecordStatus'}}, {in: query, name: dateFrom, schema: {type: string, format: date}}, {in: query, name: dateTo, schema: {type: string, format: date}}, {in: query, name: type, description: 'CHG-004 D6', schema: {enum: [WORK, DELIVERY]}}, {in: query, name: customerId, description: 'CHG-004 D6', schema: {type: string, format: uuid}}, {in: query, name: productId, description: 'CHG-004 D6（運搬は明細のいずれか）', schema: {type: string, format: uuid}}], responses: {'200': {description: Paged records, content: {application/json: {schema: {$ref: '#/components/schemas/RecordPage'}}}}}}
  /delivery-reports/{id}/fee:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {operationId: setDeliveryFee, description: 'CHG-004 D2: 運搬費（運搬報告1件に1金額）の後入力・修正。版は作らず監査。DRAFT は PATCH、BILLING_LOCKED は 409', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryFee'}}}}, responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /reports/monthly:
    get: {operationId: getMonthlySummary, description: 'CHG-004 D4: 月次集計（暦月の確定済み報告の現在の確定版）。運搬費は手入力分の合計のみ', parameters: [{in: query, name: month, required: true, schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}}, {in: query, name: type, schema: {enum: [WORK, DELIVERY]}}, {in: query, name: customerId, schema: {type: string, format: uuid}}, {in: query, name: productId, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Monthly summary（totals / daily / byProduct / byWorkType / rows / names）'}, '400': {$ref: '#/components/responses/Error'}}}
  /reports/monthly/export:
    get: {operationId: exportMonthlySummary, description: 'CHG-004 D4: Excel（集計・日別・品番別・作業内容別・明細）または CSV（sheet 単位、UTF-8 BOM）', parameters: [{in: query, name: month, required: true, schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}}, {in: query, name: type, schema: {enum: [WORK, DELIVERY]}}, {in: query, name: customerId, schema: {type: string, format: uuid}}, {in: query, name: productId, schema: {type: string, format: uuid}}, {in: query, name: format, schema: {enum: [xlsx, csv], default: xlsx}}, {in: query, name: sheet, schema: {enum: [summary, daily, product, worktype, detail], default: detail}}], responses: {'200': {description: File, content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}, text/csv: {schema: {type: string}}}}, '400': {$ref: '#/components/responses/Error'}}}
  /users:
    get: {operationId: listUsers, description: 'CHG-008: 利用者一覧（ログインID順）。OFFICE/ADMIN/AUDITOR', responses: {'200': {description: Users, content: {application/json: {schema: {type: object, required: [data,meta], properties: {data: {type: array, items: {$ref: '#/components/schemas/User'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}}}}}}
    post: {operationId: createUser, description: 'CHG-008: 利用者の作成（ADMIN）。ログインID重複は 422', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserCreate'}}}}, responses: {'201': {$ref: '#/components/responses/User'}, '422': {$ref: '#/components/responses/Error'}}}
  /users/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch: {operationId: updateUser, description: 'CHG-008: 表示名・ロールの変更（ADMIN）。ロール変更で既存セッションは無効。自分の ADMIN 外し・有効な ADMIN 0人は 422', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserUpdate'}}}}, responses: {'200': {$ref: '#/components/responses/User'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /users/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [deactivate, activate, reset-password, unlock, reset-mfa]}}]
    post: {operationId: userAction, description: 'CHG-008: 無効化・有効化・パスワード再設定・ロック解除（ADMIN）。無効化とパスワード再設定で既存セッションは無効。CHG-012: reset-mfa（多要素認証の解除、理由必須、自分以外）。reset-password・reset-mfa は再認証が必要', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserCommand'}}}}, responses: {'200': {$ref: '#/components/responses/User'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /dashboard:
    get: {operationId: getDashboard, description: 'CHG-007 SCR-10（FR-017）: 承認待ち・本日の実績・処理失敗・直近7日・要対応。APPROVAL_ENABLED のときだけ（無効時 404）', responses: {'200': {description: Dashboard, content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Dashboard'}}}}}}, '404': {$ref: '#/components/responses/Error'}}}
  /records/{type}/{id}/{action}:
    parameters: [{in: path, name: type, required: true, schema: {enum: [WORK, DELIVERY]}}, {$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [approve,reject,revoke,revise]}}]
    post: {operationId: transitionRecord, description: 'revise: 確定後の修正（CHG-004 D3。事務所は確定済み、所有者は差戻し・取消された自分の報告: CHG-007）。approve/reject/revoke: 承認（CHG-007、APPROVAL_ENABLED のときだけ。無効時 404）。reject/revoke/revise は reason 必須', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /masters/{type}:
    get: {operationId: listMasters, parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {description: Masters, content: {application/json: {schema: {type: object, required: [data,meta], properties: {data: {type: array, items: {$ref: '#/components/schemas/MasterRecord'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}}}}}}
    post: {operationId: createMaster, parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MasterWrite'}}}}, responses: {'201': {$ref: '#/components/responses/Master'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /masters/{type}/{id}:
    parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}, {$ref: '#/components/parameters/Id'}]
    get: {operationId: getMaster, responses: {'200': {$ref: '#/components/responses/Master'}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {operationId: updateMaster, parameters: [{$ref: '#/components/parameters/Preview'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MasterUpdate'}}}}, responses: {'200': {$ref: '#/components/responses/MasterOrImpact'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deactivateMaster, parameters: [{$ref: '#/components/parameters/Preview'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'200': {$ref: '#/components/responses/MasterImpact'}, '204': {description: Deactivated}, '409': {$ref: '#/components/responses/Error'}}}
  /billing-runs:
    get: {operationId: listBillingRuns, description: 'CHG-009 API-034: 請求 run の一覧（BILLING_ENABLED のときだけ。無効時は 404）', parameters: [{in: query, name: customerId, required: false, schema: {type: string, format: uuid}}, {in: query, name: status, required: false, schema: {$ref: '#/components/schemas/BillingStatus'}}], responses: {'200': {$ref: '#/components/responses/BillingRunList'}, '404': {$ref: '#/components/responses/Error'}}}
    post: {operationId: createBillingRun, description: 'CHG-009: お客様＋締め日で請求 run を作る（OPEN）。periodEnd は締め日（31=月末）。同じお客様・期間は取消以外 1 件', parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BillingRunRequest'}}}}, responses: {'201': {$ref: '#/components/responses/BillingRun'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /billing-runs/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [calculate,review,finalize,void]}}]
    post: {operationId: transitionBillingRun, description: 'CHG-009: calculate=計算（新しい計算版）、review=全警告の処置（BillingReviewCommand）、finalize=確定（請求書を作り報告を BILLING_LOCKED）、void=確定前の取消（理由必須）。計算は同期で行い 200 を返す', parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Command'}, {$ref: '#/components/schemas/BillingReviewCommand'}]}}}}, responses: {'200': {$ref: '#/components/responses/BillingRunDetail'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /billing-runs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getBillingRun, parameters: [{in: query, name: calcVersion, required: false, schema: {type: integer, minimum: 1}}], responses: {'200': {$ref: '#/components/responses/BillingRunDetail'}, '404': {$ref: '#/components/responses/Error'}}}
  /invoices/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getInvoice, description: 'CHG-011 API-022: 請求書（snapshot・帳票の10分リンク・送付先の候補・送信履歴・明細・調整）。BILLING_ENABLED のときだけ（無効時は 404）', responses: {'200': {$ref: '#/components/responses/InvoiceDetail'}, '404': {$ref: '#/components/responses/Error'}}}
  /invoices/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [issue,send,resend,void]}}]
    post: {operationId: transitionInvoice, description: 'CHG-011: issue=発行（鏡・明細のPDFを作成、両方できたら ISSUED）、send=送付（宛先は送付時に snapshot。0件は FAILED_FINAL RECIPIENT_EMPTY）、resend=再送（理由必須）、void=無効化（理由必須。請求 run も VOIDED、報告は承認済みに戻る）。issue/send/resend は 202、void は 200', parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'200': {$ref: '#/components/responses/InvoiceDetail'}, '202': {$ref: '#/components/responses/InvoiceDetail'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /billing-adjustments:
    get: {operationId: listBillingAdjustments, description: 'CHG-011 API-035: 遅延訂正の調整の一覧（新しい順）', parameters: [{in: query, name: customerId, required: false, schema: {type: string, format: uuid}}, {in: query, name: status, required: false, schema: {enum: [PENDING, APPLIED, CANCELLED]}}], responses: {'200': {$ref: '#/components/responses/BillingAdjustmentList'}, '404': {$ref: '#/components/responses/Error'}}}
    post: {operationId: createBillingAdjustment, description: 'CHG-011 API-036: 確定済みの請求書を元に調整を登録（次の請求の明細になる）。金額は 0 以外の整数円（負は値引き）', parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BillingAdjustmentRequest'}}}}, responses: {'201': {$ref: '#/components/responses/BillingAdjustment'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /billing-adjustments/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [cancel]}}]
    post: {operationId: cancelBillingAdjustment, description: 'CHG-011 API-037: 未適用の調整の取消（理由必須）', parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'200': {$ref: '#/components/responses/BillingAdjustment'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /documents/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getDocument, responses: {'200': {description: Metadata and 10-minute signed URL}, '404': {$ref: '#/components/responses/Error'}}}
  /documents/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [regenerate,send,retry]}}]
    post: {operationId: documentAction, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {description: Queued}, '409': {$ref: '#/components/responses/Error'}}}
components:
  securitySchemes: {cookieAuth: {type: apiKey, in: cookie, name: __Secure-inspexor.session}}
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 100}}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Preview: {in: query, name: preview, description: 'CHG-001: true の場合は更新/無効化せず遡及影響（MasterImpact）を返す（REQ-MST-001 遡及影響preview）', schema: {type: boolean, default: false}}
  schemas:
    LoginRequest: {type: object, required: [loginId,password], properties: {loginId: {type: string, minLength: 1, maxLength: 100}, password: {type: string, minLength: 8, maxLength: 128}}, additionalProperties: false}
    Command: {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}, reason: {type: string, maxLength: 1000}}, additionalProperties: false}
    WorkDraft: {type: object, description: 'CHG-012: 報告者がログイン中の本人以外（事務所の代理入力）なら proxyReason 必須・再認証から10分以内（過ぎていれば 403 reauthRequired）', required: [workDate,reporterId,customerId,productId,workTypeId,workerIds,startAt,endAt,quantity,defects], properties: {workDate: {type: string, format: date}, reporterId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, productId: {type: string, format: uuid}, workTypeId: {type: string, format: uuid}, lotNo: {type: [string,'null'], maxLength: 100}, workerIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}, startAt: {type: string, format: date-time}, endAt: {type: string, format: date-time}, quantity: {type: integer, minimum: 0}, defects: {type: array, items: {$ref: '#/components/schemas/Defect'}}, workLocationId: {type: [string,'null'], format: uuid}, vehicleId: {type: [string,'null'], format: uuid}, remarks: {type: [string,'null'], maxLength: 500}, proxyReason: {type: [string,'null'], maxLength: 500, description: 'CHG-012 代理入力の理由（作成時のみ）'}}, additionalProperties: false}
