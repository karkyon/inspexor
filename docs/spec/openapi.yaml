openapi: 3.1.0
info: {title: INSPEXOR API, version: 3.0.0}
servers: [{url: /api/v1}]
security: [{cookieAuth: []}]
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Session'}, '401': {$ref: '#/components/responses/Error'}}
  /auth/logout:
    post: {operationId: logout, responses: {'204': {description: Logged out}, '401': {$ref: '#/components/responses/Error'}}}
  /me:
    get: {operationId: getMe, responses: {'200': {$ref: '#/components/responses/Session'}, '401': {$ref: '#/components/responses/Error'}}}
  /work-reports:
    post:
      operationId: createWorkReport
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkDraft'}}}}
      responses: {'201': {$ref: '#/components/responses/Record'}, '422': {$ref: '#/components/responses/Error'}}
  /work-reports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getWorkReport, responses: {'200': {$ref: '#/components/responses/Record'}, '404': {$ref: '#/components/responses/Error'}}}
    patch:
      operationId: updateWorkReport
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /work-reports/{id}/confirm:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {operationId: confirmWorkReport, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports:
    post: {operationId: createDeliveryReport, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryDraft'}}}}, responses: {'201': {$ref: '#/components/responses/Record'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getDeliveryReport, responses: {'200': {$ref: '#/components/responses/Record'}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {operationId: updateDeliveryReport, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryUpdate'}}}}, responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /delivery-reports/{id}/confirm:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {operationId: confirmDeliveryReport, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}}}
  /records:
    get: {operationId: listRecords, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {in: query, name: status, schema: {$ref: '#/components/schemas/RecordStatus'}}, {in: query, name: dateFrom, schema: {type: string, format: date}}, {in: query, name: dateTo, schema: {type: string, format: date}}], responses: {'200': {description: Paged records, content: {application/json: {schema: {$ref: '#/components/schemas/RecordPage'}}}}}}
  /records/{type}/{id}/{action}:
    parameters: [{in: path, name: type, required: true, schema: {enum: [WORK, DELIVERY]}}, {$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [approve,reject,revoke,revise]}}]
    post: {operationId: transitionRecord, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'200': {$ref: '#/components/responses/Record'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /masters/{type}:
    get: {operationId: listMasters, parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {description: Masters}}}
    post: {operationId: createMaster, parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MasterWrite'}}}}, responses: {'201': {description: Created}, '422': {$ref: '#/components/responses/Error'}}}
  /masters/{type}/{id}:
    parameters: [{in: path, name: type, required: true, schema: {$ref: '#/components/schemas/MasterType'}}, {$ref: '#/components/parameters/Id'}]
    get: {operationId: getMaster, responses: {'200': {description: Master detail}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {operationId: updateMaster, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MasterUpdate'}}}}, responses: {'200': {description: Updated}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deactivateMaster, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'204': {description: Deactivated}, '409': {$ref: '#/components/responses/Error'}}}
  /billing-runs:
    post: {operationId: createBillingRun, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BillingRunRequest'}}}}, responses: {'201': {description: Billing run}}}
  /billing-runs/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [calculate,review,finalize,void]}}]
    post: {operationId: transitionBillingRun, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {description: Accepted}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /billing-runs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getBillingRun, responses: {'200': {description: Run with lines and warnings}, '404': {$ref: '#/components/responses/Error'}}}
  /invoices/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getInvoice, responses: {'200': {description: Invoice snapshot, documents, recipients and mail history}, '404': {$ref: '#/components/responses/Error'}}}
  /invoices/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [issue,send,resend,void]}}]
    post: {operationId: transitionInvoice, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {description: Accepted}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /documents/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {operationId: getDocument, responses: {'200': {description: Metadata and 10-minute signed URL}, '404': {$ref: '#/components/responses/Error'}}}
  /documents/{id}/{action}:
    parameters: [{$ref: '#/components/parameters/Id'}, {in: path, name: action, required: true, schema: {enum: [regenerate,send,retry]}}]
    post: {operationId: documentAction, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}, responses: {'202': {description: Queued}, '409': {$ref: '#/components/responses/Error'}}}
components:
  securitySchemes: {cookieAuth: {type: apiKey, in: cookie, name: __Secure-inspexor.session}}
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 16, maxLength: 100}}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
  schemas:
    LoginRequest: {type: object, required: [loginId,password], properties: {loginId: {type: string, minLength: 1, maxLength: 100}, password: {type: string, minLength: 8, maxLength: 128}}, additionalProperties: false}
    Command: {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}, reason: {type: string, maxLength: 1000}}, additionalProperties: false}
    WorkDraft: {type: object, required: [workDate,reporterId,customerId,productId,workTypeId,workerIds,startAt,endAt,quantity,defects], properties: {workDate: {type: string, format: date}, reporterId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, productId: {type: string, format: uuid}, workTypeId: {type: string, format: uuid}, lotNo: {type: [string,'null'], maxLength: 100}, workerIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}, startAt: {type: string, format: date-time}, endAt: {type: string, format: date-time}, quantity: {type: integer, minimum: 0}, defects: {type: array, items: {$ref: '#/components/schemas/Defect'}}}, additionalProperties: false}
    WorkUpdate: {allOf: [{$ref: '#/components/schemas/WorkDraft'}, {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}]}
    Defect: {type: object, required: [defectTypeId,quantity], properties: {defectTypeId: {type: string, format: uuid}, quantity: {type: integer, minimum: 0}}, additionalProperties: false}
    DeliveryDraft: {type: object, required: [deliveryDate,driverId,customerId,items], properties: {deliveryDate: {type: string, format: date}, driverId: {type: string, format: uuid}, customerId: {type: string, format: uuid}, items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DeliveryItem'}}}, additionalProperties: false}
    DeliveryUpdate: {allOf: [{$ref: '#/components/schemas/DeliveryDraft'}, {type: object, required: [expectedVersion], properties: {expectedVersion: {type: integer, minimum: 1}}}]}
    DeliveryItem: {type: object, required: [productId,quantity], properties: {productId: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}, additionalProperties: false}
    RecordStatus: {enum: [DRAFT,CONFIRMED,SUBMITTED,APPROVED,REJECTED,REVOKED,BILLING_LOCKED]}
    Record: {type: object, required: [id,status,version], properties: {id: {type: string, format: uuid}, reportNo: {type: string}, status: {$ref: '#/components/schemas/RecordStatus'}, version: {type: integer}, documentStatus: {type: [string,'null']}}}
    RecordPage: {type: object, required: [data,meta], properties: {data: {type: array, items: {$ref: '#/components/schemas/Record'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
    PageMeta: {type: object, required: [page,pageSize,total], properties: {page: {type: integer}, pageSize: {type: integer}, total: {type: integer}}}
    MasterType: {enum: [customers,contacts,workers,products,work-types,defects,holidays,rates,transport-rules,fixed-charges]}
    MasterWrite: {type: object, required: [code,name], properties: {code: {type: string, minLength: 1, maxLength: 80}, name: {type: string, minLength: 1, maxLength: 200}, customerId: {type: [string,'null'], format: uuid}, productId: {type: [string,'null'], format: uuid}, workTypeId: {type: [string,'null'], format: uuid}, email: {type: [string,'null'], format: email}, amountYen: {type: [integer,'null'], minimum: 0}, unitPrice: {type: [string,'null'], pattern: '^\\d{1,14}(\\.\\d{1,4})?$'}, validFrom: {type: [string,'null'], format: date}, validTo: {type: [string,'null'], format: date}, active: {type: boolean, default: true}}, additionalProperties: false}
    MasterUpdate: {allOf: [{$ref: '#/components/schemas/MasterWrite'}, {type: object, required: [expectedVersion,reason], properties: {expectedVersion: {type: integer, minimum: 1}, reason: {type: string, minLength: 1, maxLength: 1000}}}]}
    BillingRunRequest: {type: object, required: [customerId,periodEnd], properties: {customerId: {type: string, format: uuid}, periodEnd: {type: string, format: date}}, additionalProperties: false}
    Error: {type: object, required: [code,message,correlationId,retryable], properties: {code: {type: string}, message: {type: string}, correlationId: {type: string, format: uuid}, retryable: {type: boolean}, fields: {type: array, items: {type: object, properties: {path: {type: string}, code: {type: string}, message: {type: string}}}}}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {type: object, properties: {error: {$ref: '#/components/schemas/Error'}}}}}}
    Record: {description: Record, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Record'}}}}}}
    Session: {description: Session, content: {application/json: {schema: {type: object, properties: {data: {type: object, required: [userId,displayName,roles,expiresAt], properties: {userId: {type: string, format: uuid}, displayName: {type: string}, roles: {type: array, items: {enum: [FIELD,OFFICE,ADMIN,AUDITOR]}}, expiresAt: {type: string, format: date-time}}}}}}}}
