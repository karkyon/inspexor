name: ci
on:
  push:
    branches: [main, 'gate-*/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ITEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5433/postgres
      SCHEMA_SQL_PATH: ${{ github.workspace }}/docs/spec/schema.sql
      OPENAPI_PATH: ${{ github.workspace }}/docs/spec/openapi.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.0
      - run: pnpm install --frozen-lockfile
      - name: prisma generate
        run: cd packages/db && npx prisma generate
      - name: AI scope (T-AI-SCOPE-001)
        run: bash scripts/check-ai-scope.sh
      - name: domain
        run: cd packages/domain && npx tsc --noEmit && npx vitest run
      - name: application
        run: cd packages/application && npx tsc --noEmit && npx vitest run
      - name: config
        run: cd packages/config && npx tsc --noEmit && npx vitest run
      - name: web typecheck
        run: cd apps/web && npx tsc --noEmit
      - name: web unit + contract
        run: cd apps/web && npx vitest run
      - name: web integration (fresh DB)
        run: cd apps/web && npx vitest run --config vitest.integration.config.ts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
