name: ci
on:
  push:
    branches: [main, 'gate-*/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # G4: 日報メールの開発用 provider（EXT-03 Gmail 未提供時の代替）
      mailpit:
        image: axllent/mailpit:v1.20
        ports:
          - 8025:8025
    env:
      MAILPIT_URL: http://127.0.0.1:8025
      OPENAPI_PATH: ${{ github.workspace }}/docs/spec/openapi.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.0
      - run: pnpm install --frozen-lockfile
      - name: AI scope (T-AI-SCOPE-001)
        run: bash scripts/check-ai-scope.sh
      - name: domain
        run: cd packages/domain && npx tsc --noEmit && npx vitest run
      - name: application
        run: cd packages/application && npx tsc --noEmit && npx vitest run
      - name: docstore（MemoryDocStore の契約試験）
        run: cd packages/docstore && npx tsc --noEmit && npx vitest run && npx vitest run --config vitest.integration.config.ts
      - name: config
        run: cd packages/config && npx tsc --noEmit && npx vitest run
      - name: web typecheck
        run: cd apps/web && npx tsc --noEmit
      - name: web unit + contract
        run: cd apps/web && npx vitest run
      # CHG-006: CI の結合試験は MemoryDocStore（Firestore と同じ制約・索引検査）。エミュレータでの試験は Cloud Shell のバッチで行う
      - name: web integration（MemoryDocStore）
        run: cd apps/web && npx vitest run --config vitest.integration.config.ts
      - name: worker typecheck
        run: cd apps/worker && npx tsc --noEmit
      - name: worker chromium（PDF 生成）
        run: cd apps/worker && npx playwright-core install --with-deps chromium
      - name: worker integration（outbox → 帳票 → メール、API-024/025）
        run: cd apps/worker && npx vitest run --config vitest.integration.config.ts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
